[project]
name = "doc-ingestor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rmun-odoo", email = "rmun@odoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.150.0",
    "pydantic-settings>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]